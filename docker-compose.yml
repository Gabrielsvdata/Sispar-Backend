# Ambiente local: API + Postgres
services:
  backend:
    build: .
    container_name: sispar_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://sispar:sispar@sispar-db:5432/sispar
      - DEMO_MODE=true
    depends_on:
      sispar-db:
        condition: service_healthy

  sispar-db:
    image: postgres:16
    container_name: sispar-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sispar
      POSTGRES_PASSWORD: sispar
      POSTGRES_DB: sispar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sispar"]
      interval: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
